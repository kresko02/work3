    <head>

    <!-- Підключення шрифтів Montserrat та Roboto з Google Fonts -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Підключення іконки та стилів -->
    <link rel="shortcut icon" href="./image/favicon1.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/main.css">
</head>
</head>
<body>
    <header class="header">
        <div class="wrapper">
            <div class="header__wrapper">
                <div class="wrapper_logo">
                    <a href="./index.html" class="wrapper_logo-link">
                        <img src="./image/logo.png" alt="logo" class="wrapper_logo-pic" width="64" height="64">
                    </a>
                </div>
                <nav class="header_nav">
                    <ul class="header_list-menu">
                        <li class="header_item"><a href="./index.html" class="header_link">Головна</a></li>
                        <li class="header_item"><a href="./news.html" class="header_link">Новини</a></li>
                        <li class="header_item"><a href="./education.html" class="header_link">Навчання</a></li>
                        <li class="header_item"><a href="./contacts.html" class="header_link">Контакти</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <form class="feedback-form" action="#" method="post">
    <div class="form-group">
      <label for="name">Ім'я</label>
      <input id="name" name="name" type="text" placeholder="Ваше ім'я" required>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="Ваш email" required>
    </div>

    <div class="form-group">
      <label for="message">Повідомлення</label>
      <textarea id="message" name="message" placeholder="Ваше повідомлення" required></textarea>
    </div>

    <button class="btn-submit" type="submit">Надіслати</button>
  </form>
    </main>
